name: Actualizar datos y publicar

# Corre el pipeline del backend, guarda el historial en git y publica en GitHub Pages el sitio estático que arma Astro (frontend/) con los
# datos que deja topwx site.
# Requiere: Settings > Pages > Source = "GitHub Actions".
on:
  schedule:
    - cron: "30 22 * * 1-5" # días hábiles, después del cierre de EE. UU. (hora UTC)
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write # commit del historial
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # La base SQLite es solo caché: si se pierde, se vuelven a bajar los precios y el historial se restaura de
      # backend/history/history.json. Cada ejecución guarda su propia clave y restaura la más reciente.
      - name: Restaurar la base SQLite
        uses: actions/cache@v6
        with:
          path: backend/data
          key: topwx-db-${{ github.run_id }}
          restore-keys: topwx-db-

      # Se compila con el Go de go.mod (staticcheck debe estar hecho con una versión igual o más nueva que la del módulo).
      # Versión fija para que un release nuevo no frene la publicación; subirla a propósito.
      - name: Linter del backend (staticcheck)
        working-directory: backend
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck ./...

      - name: Tests del backend
        working-directory: backend
        run: go test ./...

      - name: Pipeline
        working-directory: backend
        run: |
          go build -o bin/topwx ./cmd/topwx
          ./bin/topwx pipeline

      - name: Guardar historial en git
        run: |
          git add backend/history/history.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el historial."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualiza historial ($(date -u +%F))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # El pipeline dejó los datos en frontend/src/data y frontend/public; Astro los convierte en HTML estático.
      # En Pages el sitio vive en /<repositorio>/, de ahí SITE_BASE.
      - name: Sitio estático (Astro)
        working-directory: frontend
        env:
          SITE_BASE: /${{ github.event.repository.name }}
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
