<!doctype html>
<!-- Cáscara común de todas las páginas (encabezado, pestañas, pie); cada página define «content» y, si hace falta, «scripts».
     Fecha: 2026-11-19 -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.DocTitle}}</title>
  <meta name="description" content="Momentum y scores: estrategia de momentum del S&amp;P 500 con backtest, ETFs y modelo por score de EE. UU.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b63ce'/%3E%3Cpath d='M6 22l7-8 5 5 8-10' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{.Root}}site.css">
  <script>
    try {
      const saved = localStorage.getItem('theme');
      document.documentElement.dataset.theme = (saved ? saved === 'dark' : true) ? 'dark' : 'light';
    } catch {}
  </script>
</head>
<body>
<main class="page">
  <header class="top">
    <div class="corner">
      <a class="btn{{if .Home.Active}} active{{end}}" href="{{.Root}}{{.Home.Href}}">{{.Home.Label}}</a>
      {{if .About.Label}}<a class="btn{{if .About.Active}} active{{end}}" href="{{.Root}}{{.About.Href}}">{{.About.Label}}</a>{{end}}
      <button id="theme" class="btn" type="button" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema">Tema</button>
    </div>
    <h1>{{.SiteName}}</h1>
    <h2 class="section">{{.Title}}</h2>
    <p class="sub">{{.Sub}}</p>
  </header>

  <nav class="tabs" aria-label="Secciones">
    {{- range .Groups}}
    <div class="group">
      {{if .Label}}<span class="cap{{if .On}} on{{end}}">{{.Label}}</span>{{end}}
      <div class="row">
        {{- range .Links}}
        <a class="tab{{if .Active}} active{{end}}" href="{{$.Root}}{{.Href}}"{{if .Active}} aria-current="page"{{end}}>{{.Label}}</a>
        {{- end}}
      </div>
    </div>
    {{- end}}
  </nav>

  {{template "content" .}}

  <footer>{{.Footer}}</footer>
</main>
<script src="{{.Root}}site.js" defer></script>
{{block "scripts" .}}{{end}}
</body>
</html>
